name: Manual GitHub Pages recovery
run-name: Pages recovery ${{ inputs.commit_sha || github.sha }}

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact commit to build and deploy
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

# Manual recovery only. Vercel serves production; data collection does not
# rebuild Pages. Verify this run and its data timestamps before any DNS cutover.
# The existing Pages site becomes stale between intentional recovery runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ inputs.commit_sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Run unit and route tests
        run: npm test
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
