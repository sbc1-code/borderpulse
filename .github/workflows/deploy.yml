name: Deploy to GitHub Pages
run-name: Deploy ${{ inputs.commit_sha || github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact commit to build and deploy
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

# Only this workflow deploys Pages. Scheduled data fetches explicitly dispatch
# this workflow with their validated snapshot SHA because pushes made by the
# workflow GITHUB_TOKEN do not trigger another workflow.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Run unit and route tests
        run: npm test
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
