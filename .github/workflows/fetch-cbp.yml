name: Fetch CBP wait times

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

# This workflow and anomaly-scan.yml both commit generated data to main. They
# must share one writer queue or scheduled runs can race while pushing.
concurrency:
  group: repository-writer
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is load-bearing, not hygiene. This workflow validates a
      # full site build, and `npm run build` runs build-aggregates.mjs, which
      # reconstructs the 30-day window with `git log --since=... -- crossings.json`.
      # Under the default depth-1 clone that log returns one commit, so every
      # aggregate silently collapsed to ~2 samples while the pages kept claiming
      # "30 days of CBP data" (found 2026-07-27; rankings.json had fallen to 1
      # entry). deploy.yml already does this; it just stopped being the deployer.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Fetch CBP border wait times
        run: node scripts/fetch-cbp.mjs
      - name: Fetch USD/MXN exchange rate
        run: node scripts/fetch-fx.mjs
      - name: Fetch southbound estimates
        run: node scripts/fetch-sb.mjs
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      - name: Validate static site
        run: npm run build
      - name: Commit validated data snapshot
        id: snapshot
        run: |
          git config user.name  "borderpulse-bot"
          git config user.email "borderpulse-bot@users.noreply.github.com"
          git add public/data/crossings.json public/data/exchange-rate.json public/data/crossings-sb.json
          if git diff --cached --quiet; then
            echo "No data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(data): refresh CBP + FX + SB snapshot"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Unable to push validated snapshot after $attempt attempts."
                exit 1
              fi
              git fetch origin main
              git rebase origin/main
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - name: Dispatch exact snapshot to the sole Pages deployer
        if: steps.snapshot.outputs.changed == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main',
              inputs: {
                commit_sha: '${{ steps.snapshot.outputs.commit_sha }}',
              },
            });

      # Auto-file an issue on failure, dedup'd by label so we don't spam
      # every 15 min. Closes the loop on "I saw it in Gmail and forgot."
      - name: Open issue on failure (deduped)
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const label = 'ci-failure';
            const flow = 'fetch-cbp';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: `${label},${flow}`,
              state: 'open',
            });
            if (existing.data.length > 0) {
              core.info(`Open ${flow} failure issue already exists (#${existing.data[0].number}). Skipping.`);
              return;
            }
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[ops] ${context.workflow} failing on main`,
              body: [
                `**Workflow:** \`${context.workflow}\``,
                `**Commit:** \`${context.sha.substring(0, 7)}\``,
                `**First failure:** ${new Date().toISOString()}`,
                ``,
                `Subsequent failures are suppressed until this issue is closed.`,
                ``,
                `[View failed run](${runUrl})`,
              ].join('\n'),
              labels: ['ops', label, flow],
            });

      - name: Close recovered failure issue
        if: success()
        uses: actions/github-script@v9
        with:
          script: |
            const label = 'ci-failure';
            const flow = 'fetch-cbp';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: `${label},${flow}`,
              state: 'open',
            });
            for (const issue of existing.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Recovered by successful run ${context.runId}.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }
