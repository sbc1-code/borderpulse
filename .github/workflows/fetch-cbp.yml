name: Fetch CBP wait times

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

# This workflow and anomaly-scan.yml both commit generated data to main. They
# must share one writer queue or scheduled runs can race while pushing.
concurrency:
  group: repository-writer
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      # Full history is needed here to materialize the rolling 30-day snapshot
      # artifact. Site builds consume the artifact and can use shallow clones.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Generate, validate and publish current data
        id: snapshot
        run: node scripts/write-data-snapshot.mjs cbp
      - name: Dispatch exact snapshot to the sole Pages deployer
        if: steps.snapshot.outputs.changed == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main',
              inputs: {
                commit_sha: '${{ steps.snapshot.outputs.commit_sha }}',
              },
            });

      # Auto-file an issue on failure, dedup'd by label so we don't spam
      # every 15 min. Closes the loop on "I saw it in Gmail and forgot."
      - name: Open issue on failure (deduped)
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const label = 'ci-failure';
            const flow = 'fetch-cbp';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: `${label},${flow}`,
              state: 'open',
            });
            if (existing.data.length > 0) {
              core.info(`Open ${flow} failure issue already exists (#${existing.data[0].number}). Skipping.`);
              return;
            }
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[ops] ${context.workflow} failing on main`,
              body: [
                `**Workflow:** \`${context.workflow}\``,
                `**Commit:** \`${context.sha.substring(0, 7)}\``,
                `**First failure:** ${new Date().toISOString()}`,
                ``,
                `Subsequent failures are suppressed until this issue is closed.`,
                ``,
                `[View failed run](${runUrl})`,
              ].join('\n'),
              labels: ['ops', label, flow],
            });

      - name: Close recovered failure issue
        if: success()
        uses: actions/github-script@v9
        with:
          script: |
            const label = 'ci-failure';
            const flow = 'fetch-cbp';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: `${label},${flow}`,
              state: 'open',
            });
            for (const issue of existing.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Recovered by successful run ${context.runId}.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }
